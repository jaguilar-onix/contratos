# Construye la imagen para PC (amd64) y para NAS con procesador ARM (arm64),
# y la publica en el registro de GitHub.
#
# Un Synology de gama media no deberia construir esto: la instalacion de
# LibreOffice sobre 2 GB de RAM tarda horas o se queda sin memoria. Aqui se
# construye una vez y el NAS solo la descarga.
name: Imagen

on:
  push:
    branches: [claude/contract-generator-attachments-v72com]
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # La imagen arm64 se construye emulada; por eso este trabajo tarda.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
