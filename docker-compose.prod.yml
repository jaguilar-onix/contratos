# Despliegue en un servidor propio (VPS): la aplicacion queda detras de Caddy,
# que resuelve el certificado HTTPS y pide usuario y contrasena.
#
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  contratos:
    build: .
    # Sin "ports": al servidor solo se entra por Caddy.
    expose:
      - "3000"
    volumes:
      # Los machotes viven aqui: sin este volumen se pierden al recrear.
      - ./data:/app/data
    environment:
      LIMITE_MB: 25
      ACCESO_USUARIO: ${ACCESO_USUARIO:?falta ACCESO_USUARIO en .env}
      ACCESO_CLAVE: ${ACCESO_CLAVE:?falta ACCESO_CLAVE en .env}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMINIO: ${DOMINIO:?falta DOMINIO en .env}
    depends_on:
      - contratos
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
