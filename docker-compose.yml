services:
  contratos:
    build: .
    ports:
      - "3000:3000"
    volumes:
      # Los machotes viven aqui: sin este volumen se pierden al recrear el contenedor.
      - ./data:/app/data
    environment:
      LIMITE_MB: 25
      # Sin estas dos, la aplicacion corre abierta: comodo en la red de la
      # oficina, inaceptable en cuanto sea alcanzable desde internet.
      ACCESO_USUARIO: ${ACCESO_USUARIO:-}
      ACCESO_CLAVE: ${ACCESO_CLAVE:-}
    restart: unless-stopped
